build_dir = "hw/ip/aou/dv/build/uvm_reg/1x512-sp64-nxt"
work_dir = "hw/ip/aou/dv/build/uvm_reg/1x512-sp64-nxt"
defines = ["AOU_RP_COUNT=1", "AOU_RP_DATA_W=512", "AOU_RP0_DATA_W=512", "AOU_RP1_DATA_W=512",
           "AOU_RP2_DATA_W=512", "AOU_RP3_DATA_W=512", "AOU_FDI_CONFIG=1", "AOU_TX_NXT_PACKING=1"]

[targets.2xmix-sp64-rxf]
