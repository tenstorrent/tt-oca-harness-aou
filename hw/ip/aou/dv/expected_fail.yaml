  check: 'AOU-R26: [l3] DUT MsgCredit'
  seed_dependent: true
  note: >-
    a MsgCredit in the flit of the DUT's DeactivateAck, reported "after its DeactivateAck" or,
    when that Ack completes the deactivation, "in DISABLED" (WDATA on 2x512-tp32_64)

