  seed_dependent: true
  note: >-
    CREDIT_MANAGE=0, remote DeactivateReq first: a request the DUT accepted before it is
    still in the DUT's TX backlog, crosses it on the link, and is open when the DUT sends
    DeactivateReq (MAS 7.3.5/7.3.6 re-activation vs AoU v0.8 8.4). Matches only when every
    unanswered request on that RP arrived after L3's DeactivateReq; any other AOU-R33 fails.
    4x512-sp64 VCS +who=both +order=simul +deact_who=both +credit_manage=0 +busy=1 seed 3

