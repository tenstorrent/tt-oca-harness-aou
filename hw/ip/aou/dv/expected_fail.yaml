#
# Known DUT bugs that make tests fail. Each entry names the test, the bug (its
# GitHub issue, tenstorrent/tt-oca-harness-aou#<n>, or BUGS/NNN while the draft is
# staged and not yet filed; AGENTS.md "Reporting bugs") and the exact failing
# check: a substring of the UVM_ERROR message. A run of an affected test passes review only if every
# UVM_ERROR it reports matches one of its entries. Seeds change which writes hit
# the bug, not whether. An entry with `requires: <bug>` is a generic follow-on
# symptom: it counts only when a bug-specific entry (one without `requires:`) for
# that bug matched in the same run. `test: '*'` makes an entry apply to every test,
# for a DUT bug that every run reaches. `check_re:` (a regular expression) replaces
# `check:` when the signature spans several fields of one message. `when_re:` (a
# regular expression) limits an entry to runs whose log matches it, such as one
# CONFIG or active PHY of aou_perf_test (its PERF_GATE lines carry the key).

# Each bug has bug-specific checks; the generic symptoms it causes (traffic stalls,
# scoreboard mismatches, failed handshakes) carry `requires:` and only count when
# a bug-specific check for that bug fired in the same run (scripts/check_run.py).

# Performance gate (aou_perf_chk). Keys are <CONFIG>|<PHY>|<scenario>|<window>|<link>;
# each entry is limited (when_re) to the CONFIG and scenarios where the bug shows.
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 1x256-sp32\|0\|S[12]\|\w+\|l2r below target'
  when_re: 'PERF_GATE 1x256-sp32\|0\|S[12]\|'
  note: >-
    256-bit data messages at a 32 B FDI: the DUT TX link caps at 16.00 B/cycle (one data
    message per 12-granule pack step), 60-83% of the model
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 1x256-sp32\|0\|S[12]\|\w+\|r2l below target'
  when_re: 'PERF_GATE 1x256-sp32\|0\|S[12]\|'
  requires: BUGS/046
  note: >-
    the DUT RX link in the same window, held to the capped TX link's transaction rate
    (bw_mix_l2r 16.00) or, for 1-beat local reads (sm_rd_l2r 16.00), to the DUT's ReadReq
    rate; the latter is in the triage queue to confirm it is the same pack-step limit
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 2xmix-tp64_128\|[01]\|S1\|\w+\|l2r below target'
  when_re: 'PERF_GATE 2xmix-tp64_128\|[01]\|S1\|'
  note: >-
    FDI_PACK_WD 1024 (widest FDI 128 B): the DUT TX link caps at 32/48 B/cycle on PHY0 and
    64/96 on PHY1 (58-87% of the model), on either PHY
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 2xmix-tp64_128\|[01]\|S1\|bw_mix_r2l\|r2l below target'
  when_re: 'PERF_GATE 2xmix-tp64_128\|[01]\|S1\|'
  requires: BUGS/046
  note: remote-issued mix, the remote's writes held to the rate of its reads served by the capped TX link
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 4xmix4211-sp128\|0\|S[123]\|\w+\|l2r below target'
  when_re: 'PERF_GATE 4xmix4211-sp128\|0\|S[123]\|'
  note: 'FDI_PACK_WD 1024 at a 128 B FDI: the DUT TX link caps at 64 B/cycle (58-75% of the model)'
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 4xmix4211-sp128\|0\|S[12]\|\w+\|r2l below target'
  when_re: 'PERF_GATE 4xmix4211-sp128\|0\|S[12]\|'
  requires: BUGS/046
  note: the DUT RX link in mixed and both-sides windows, held to the capped TX link's rate

# AoU 4.4 as the v0.9 draft words it (+v0p9draft): an Activation message shares its flit
# only with one CrdtGrant after an ActivateReq/Ack or with responses after a DeactivateReq.
# The DUT's ActivateAck+CrdtGrant and DeactivateReq+response flits are those layouts; what
# remains is requests leaving in the ActivateAck's flit, the stimulus of aou_act_flit_test.

- test: aou_act_flit_test
  bug: tenstorrent/tt-oca-harness-aou#127
  check_re: 'AOU-R6: DUT->remote flit#\d+ G0: Activation message shares its flit: ActivateAck '
  when_re: 'DUT rules: AoU v0\.9 draft \(\+v0p9draft\)[\s\S]*\[aou_act_flit_vseq\] requests while DISABLED'
  note: >-
    +v0p9draft +mode=act_req: the stimulus this test exists for. Requests held across the
    activation leave in the ActivateAck's flit; the DUT follows v0.7.1 (Activation at G0 only).
    +mode=deact_rsp passes: its flits are the permitted layouts
