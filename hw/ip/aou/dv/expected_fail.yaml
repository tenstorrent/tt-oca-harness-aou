#
# Known DUT bugs that make tests fail. Each entry names the test, the bug (its
# GitHub issue, tenstorrent/tt-oca-harness-aou#<n>, or BUGS/NNN while the draft is
# staged and not yet filed; AGENTS.md "Reporting bugs") and the exact failing
# check: a substring of the UVM_ERROR message. A run of an affected test passes review only if every
# UVM_ERROR it reports matches one of its entries. Seeds change which writes hit
# the bug, not whether. An entry with `requires: <bug>` is a generic follow-on
# symptom: it counts only when a bug-specific entry (one without `requires:`) for
# that bug matched in the same run. `test: '*'` makes an entry apply to every test,
# for a DUT bug that every run reaches. `check_re:` (a regular expression) replaces
# `check:` when the signature spans several fields of one message. `when_re:` (a
# regular expression) limits an entry to runs whose log matches it, such as one
# CONFIG or active PHY of aou_perf_test (its PERF_GATE lines carry the key).

# AoU v0.8 4.4 puts an Activation message
# alone in its flit (v0.7.1 asks only for G0). On every activation the DUT sends its initial
# CrdtGrant in the flit of its ActivateAck, so with +v0p8 the L3 model reports AOU-R6 in every
# T1 test; `test: '*'` applies the entry to all of them, and `when_re` to +v0p8 runs only.
# Only two layouts are covered: the ActivateAck with the CrdtGrant, and a
# DeactivateReq followed only by responses. Any other message beside an Activation still
# fails the run.

- test: aou_reg_bit_bash_test
  bug: BUGS/004
  check: 'Writing a 1 in bit #2 of register "aou_core.aou_con0"'
  note: AXI_SPLIT_TR_EN has no storage and reads 0

- test: aou_reg_access_test
  bug: BUGS/004
  check: 'REG-R02: aou_core.aou_con0.axi_split_tr_en'

- test: aou_reg_alias_test
  bug: BUGS/004
  check: 'REG-R08: aou_core.aou_con0.axi_split_tr_en'
  seed_dependent: true
  note: only seeds whose alias walk writes aou_con0 (Verilator seed 2 never touches it)

- test: aou_link_force_deact_test
  bug: BUGS/010
  check: 'DeactivateReq: PropertyReq on a non-ActivateReq opcode'
  note: DEACTIVATE_FORCE sends DeactivateReq with PropertyReq=1 (L3 model, AOU-R11)

- test: aou_link_force_deact_test
  bug: BUGS/010
  check: 'AOU-R11: AOU_FDI_CHECKER VIOL_RSVD_NONZERO LP(DUT->peer)'
  seed_dependent: true
  note: >-
    the same DeactivateReq seen by AOU_FDI_CHECKER; two-PHY builds (tp configs) have no
    AOU_FDI_CHECKER, so only the L3 model's entry above matches there

- test: aou_act_after_deact_test
  bug: BUGS/020
  check: 'AOU-R6: DUT->remote'
  seed_dependent: true
  note: >-
    ActivateReq co-packed with the DUT's DeactivateAck (the second trigger path BUGS/020
    names); not seen on T1 1x512-sp64 (VCS, Verilator), kept so a hit is tied to the bug

- test: aou_act_after_deact_test
  bug: BUGS/020
  check: 'AOU-R6: AOU_FDI_CHECKER VIOL_MISC_PLACEMENT'
  seed_dependent: true
  note: the same flit seen by AOU_FDI_CHECKER

# Each bug has bug-specific checks; the generic symptoms it causes (traffic stalls,
# scoreboard mismatches, failed handshakes) carry `requires:` and only count when
# a bug-specific check for that bug fired in the same run (scripts/check_run.py).

# Performance gate (aou_perf_chk). Keys are <CONFIG>|<PHY>|<scenario>|<window>|<link>;
# each entry is limited (when_re) to the CONFIG and scenarios where the bug shows.
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 1x256-sp32\|0\|S[12]\|\w+\|l2r below target'
  when_re: 'PERF_GATE 1x256-sp32\|0\|S[12]\|'
  note: >-
    256-bit data messages at a 32 B FDI: the DUT TX link caps at 16.00 B/cycle (one data
    message per 12-granule pack step), 60-83% of the model
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 1x256-sp32\|0\|S[12]\|\w+\|r2l below target'
  when_re: 'PERF_GATE 1x256-sp32\|0\|S[12]\|'
  requires: BUGS/046
  note: >-
    the DUT RX link in the same window, held to the capped TX link's transaction rate
    (bw_mix_l2r 16.00) or, for 1-beat local reads (sm_rd_l2r 16.00), to the DUT's ReadReq
    rate; the latter is in the triage queue to confirm it is the same pack-step limit
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 2xmix-tp64_128\|[01]\|S1\|\w+\|l2r below target'
  when_re: 'PERF_GATE 2xmix-tp64_128\|[01]\|S1\|'
  note: >-
    FDI_PACK_WD 1024 (widest FDI 128 B): the DUT TX link caps at 32/48 B/cycle on PHY0 and
    64/96 on PHY1 (58-87% of the model), on either PHY
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 2xmix-tp64_128\|[01]\|S1\|bw_mix_r2l\|r2l below target'
  when_re: 'PERF_GATE 2xmix-tp64_128\|[01]\|S1\|'
  requires: BUGS/046
  note: remote-issued mix, the remote's writes held to the rate of its reads served by the capped TX link
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 4xmix4211-sp128\|0\|S[123]\|\w+\|l2r below target'
  when_re: 'PERF_GATE 4xmix4211-sp128\|0\|S[123]\|'
  note: FDI_PACK_WD 1024 at a 128 B FDI: the DUT TX link caps at 64 B/cycle (58-75% of the model)
- test: aou_perf_test
  bug: BUGS/046
  check_re: 'T1-P02: 4xmix4211-sp128\|0\|S[12]\|\w+\|r2l below target'
  when_re: 'PERF_GATE 4xmix4211-sp128\|0\|S[12]\|'
  requires: BUGS/046
  note: the DUT RX link in mixed and both-sides windows, held to the capped TX link's rate
- test: aou_perf_test
  bug: BUGS/047
  check_re: 'T1-P02: (1x512-sp64|4x512-sp64|3x512-sp64|2x512-tp32_64)\|\d\|S1\|bw_(rd|mix)\|l2r below target'
  when_re: 'PERF_GATE (1x512-sp64|4x512-sp64|3x512-sp64|2x512-tp32_64)\|\d\|S1\|'
  seed_dependent: true
  note: >-
    reads both ways: the DUT TX link carries remote read data at 97.0-97.8% of the model, just
    above the gate (bw_rd l2r: 1x512 0.9704, 3x512 0.9735, 4x512 0.9773, 2x512-tp32_64 0.9780 and
    0.9735; the same on every seed), so it does not fire today; kept for when it dips below

- test: '*'
  bug: BUGS/059
  check_re: 'AOU-R6: DUT->remote flit#\d+ G0: Activation message shares its flit: ActivateAck CrdtGrant( \(\+1 continuing\))?$'
  when_re: 'DUT rules: AoU v0\.8 \(\+v0p8\)'
  seed_dependent: true
  note: >-
    the DUT's initial CrdtGrant at G1 of its ActivateAck flit (v0.8 4.4; v0.7 allowed it);
    the TX activation gate places the Activation at G0 of an empty ring but lets later
    messages follow it in the same flit

- test: '*'
  bug: BUGS/059
  check_re: 'AOU-R6: DUT->remote flit#\d+ G0: Activation message shares its flit: DeactivateReq( (WriteResp|ReadData\d+))*( \(\+1 continuing\))?$'
  when_re: 'DUT rules: AoU v0\.8 \(\+v0p8\)'
  seed_dependent: true
  note: >-
    the same TX gate: pending responses (legal after the DeactivateReq, v0.8 8.4) packed
    into the DeactivateReq's flit (4x512-sp64 aou_act_after_deact_test +busy=1 seed 2)

- test: aou_act_flit_test
  bug: BUGS/059
  check_re: 'AOU-R6: DUT->remote flit#\d+ G0: Activation message shares its flit: ActivateAck '
  when_re: 'DUT rules: AoU v0\.8 \(\+v0p8\)[\s\S]*\[aou_act_flit_vseq\] requests while DISABLED'
  note: >-
    +v0p8 +mode=act_req: the stimulus this test exists for. Requests held across the activation
    leave in the ActivateAck's flit; the DUT follows v0.7.1 (Activation at G0 only). +mode=deact_rsp
    needs no entry of its own: its ActivateAck+CrdtGrant and DeactivateReq+response flits are the
    two layouts the all-test entries above cover (an entry here would never match, an XPASS)
