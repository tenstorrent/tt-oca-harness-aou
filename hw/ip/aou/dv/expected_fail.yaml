  note: >-
    BUGS/029 cause 1 reached through BUGS/021: the B for a write the recovery's AOU_SW_RESET
    aborted is a stray on the DUT M port once the DUT has re-activated; the DUT raises
    INT_MI0_ID_MISMATCH, re-sets it after every W1C while the B is presented, and sends a WriteResp
