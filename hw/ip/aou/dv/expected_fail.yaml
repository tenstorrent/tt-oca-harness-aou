- test: aou_invalid_actmsg_test
  bug: BUGS/019
  check: 'T1-C40: [l3] DUT advertised'
  seed_dependent: true
  note: >-
    an ActivateReq in ENABLED restarts the DUT's activation, which advertises the whole RX FIFO
    again on top of the credit the remote die holds (019 B and its addendum); +state=enabled cases

- test: '*'
  bug: BUGS/059
  check_re: 'AOU-R6: DUT->remote flit#\d+ G0: Activation message shares its flit: ActivateAck CrdtGrant( \(\+1 continuing\))?$'
  when_re: 'DUT rules: AoU v0\.8 \(\+v0p8\)'
  seed_dependent: true
  note: >-
    the DUT's initial CrdtGrant at G1 of its ActivateAck flit (v0.8 4.4; v0.7 allowed it);
    the TX activation gate places the Activation at G0 of an empty ring but lets later
    messages follow it in the same flit

- test: '*'
  bug: BUGS/059
  check_re: 'AOU-R6: DUT->remote flit#\d+ G0: Activation message shares its flit: DeactivateReq( (WriteResp|ReadData\d+))+( \(\+1 continuing\))?$'
  when_re: 'DUT rules: AoU v0\.8 \(\+v0p8\)'
  seed_dependent: true
  note: >-
    the same TX gate: pending responses (legal after the DeactivateReq, v0.8 8.4) packed
    into the DeactivateReq's flit (4x512-sp64 aou_act_after_deact_test +credit_manage=1
    +busy=1 seed 2)

- test: aou_act_flit_test
  bug: BUGS/059
  check_re: 'AOU-R6: DUT->remote flit#\d+ G0: Activation message shares its flit: (ActivateAck|DeactivateReq) '
  when_re: 'DUT rules: AoU v0\.8 \(\+v0p8\)'
  note: >-
    +v0p8: the stimulus this test exists for. Requests held across the activation leave in the
    ActivateAck's flit, and responses in the DeactivateReq's; the DUT follows v0.7.1 (Activation
    at G0 only)

- test: aou_act_flit_test
