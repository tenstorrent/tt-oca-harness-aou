#
# Known DUT bugs that make tests fail. Each entry names the test, the bug (its
# GitHub issue, tenstorrent/tt-oca-harness-aou#<n>, or BUGS/NNN while the draft is
# staged and not yet filed; AGENTS.md "Reporting bugs") and the exact failing
# check: a substring of the UVM_ERROR message. A run of an affected test passes review only if every
# UVM_ERROR it reports matches one of its entries. Seeds change which writes hit
# the bug, not whether. An entry with `requires: <bug>` is a generic follow-on
# symptom: it counts only when a bug-specific entry (one without `requires:`) for
# that bug matched in the same run. `test: '*'` makes an entry apply to every test,
# for a DUT bug that every run reaches. `check_re:` (a regular expression) replaces
# `check:` when the signature spans several fields of one message. `when_re:` (a
# regular expression) limits an entry to runs whose log matches it, such as one
# CONFIG or active PHY of aou_perf_test (its PERF_GATE lines carry the key).
# AOU_FDI_CHECKER's AOU-R29/AOU-R30 reports end in the DUT's CREDIT_MANAGE: the
# BUGS/009 LP(DUT->peer) entries match CREDIT_MANAGE=1 only, since with 0 the MAS
# forbids credits after DeactivateAck and such a report is a new finding. Under AoU
# v0.8 8.4 the checker permits ReadData/WriteResp after one's own DeactivateReq and
# request credits after one's own DeactivateAck, so the credit-order entries left are the
# response credits after it (v0.8 is silent; the checker keeps v0.7's rule as the
# interim).

- test: aou_link_act_deact_test
  bug: BUGS/060
  check_re: 'AOU-R29: AOU_FDI_CHECKER VIOL_ADV_ORDER PL\(peer->DUT\) .* CREDIT_MANAGE=1'
  seed_dependent: true
  note: >-
    testbench (the remote model, not the DUT): with CREDIT_MANAGE=1 it returns RDATA/WRESP
    credit after its own DeactivateAck, as the MAS mode does; AOU_FDI_CHECKER's interim
    (v0.8 8.4 is silent on response credits after the Ack) keeps v0.7's rule and reports it

# AoU v0.8 4.4 puts an Activation message
# alone in its flit (v0.7.1 asks only for G0). On every activation the DUT sends its initial
# CrdtGrant in the flit of its ActivateAck, so with +v0p8 the L3 model reports AOU-R6 in every
# T1 test; `test: '*'` applies the entry to all of them, and `when_re` to +v0p8 runs only.
# Only two layouts are covered: the ActivateAck with the CrdtGrant, and a
# DeactivateReq followed only by responses. Any other message beside an Activation still
# fails the run.

