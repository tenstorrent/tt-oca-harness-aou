# BUGS/039: a CrdtGrant that starts in the last granule of a 64-byte RX chunk is decoded
# before its second granule arrives when pl_valid has a bubble there, so the DUT takes
# garbage for the second-granule credit fields. Too much credit shows as the DUT sending
# beyond what the remote die granted; lost credit shows as a stall (no bug-specific
# signature, so such a run stays FAIL).
- test: aou_credit_return_test
