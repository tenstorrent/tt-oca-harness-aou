# #131 at the 256 B FDI, where one pack step is the whole flit: the DUT TX fills a
# flit with one data message and no more (measured 2026-11-18: 1.00 messages per
# flit on 4xmix-sp256, 15.7 of 48 granules, against 3.06 messages and 48.0 granules
# on the reverse link in the same run). One entry per measured window, each bounded
# to the plateau it was measured at, +-4%: a further drop stops matching and fails,
# and a window that recovers leaves its entry unused, which is XPASS. The two r2l
# entries are consequences of a capped l2r direction in the same window, not
# independent symptoms (bw_rd_r2l, r2l alone, measures 219.41 on this config).
- test: aou_perf_test
  bug: tenstorrent/tt-oca-harness-aou#131
  check_re: 'T1-P02: 4xmix-sp256\|0\|S1\|bw_wr\|l2r below target: (69|7[0-4])\.[0-9]+ B/cycle'
  when_re: 'PERF_GATE 4xmix-sp256\|0\|S1\|'
  note: >-
    four RPs at 128/64/32/64 B on a 256 B FDI: one WriteData per flit (15.7 of 48
    granules) where the reverse link packs 3.06 messages per flit; 71.97 B/cycle,
    0.33 of the model
