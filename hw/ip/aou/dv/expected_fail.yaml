# BUGS/021 and BUGS/007 mechanisms that the BUGS/024/029 deadlock hid: with the 029 fix
# the traffic after AOU_SW_RESET runs on, and these follow. T1-L28 is the bug-specific
# check for the S-port case wherever a beat is accepted inside the reset; with the 021
# fix's guard it follows the guard's isolation and stays silent.
- test: aou_link_event_test
  bug: BUGS/021
  check: 'T1-L28: s_axi'
  seed_dependent: true
  note: >-
    an S-port AW/W/AR handshaken while the core is in AOU_SW_RESET is lost (VCS 1x512-sp64
    +event=inband_drop seed 1: s_axi0 W at 820.5 ns, AW/W/AR at 1310.5 ns with the core
    reset low); later Bs and W-to-AW pairing shift

- test: aou_reset_test
  bug: BUGS/021
  check: 'T1-L28: s_axi'
  seed_dependent: true
  note: >-
    an S-port AW and W beat accepted inside the AOU_SW_RESET pulse (VCS 1x512-sp64
    +reset=sw seed 1, at 1550.5 ns with the core reset low)

- test: aou_link_event_test
  bug: BUGS/021
  check: 'AXI-S02: remote->local'
  requires: BUGS/021
  seed_dependent: true
  note: >-
    an M-port W burst cut by the recovery's AOU_SW_RESET (WVALID drops with WLAST=0); the
    local subordinate pairs later beats with it, so remote->local writes land wrong

- test: aou_reset_test
  bug: BUGS/021
  check: 'AXI-S02: remote->local'
  requires: BUGS/021
  seed_dependent: true
  note: the same cut M-port burst after +reset=sw

- test: aou_link_event_test
  bug: BUGS/021
  check: 'AXI-S04: remote->local'
  requires: BUGS/021
  seed_dependent: true
  note: a remote read of bytes a cut M-port burst left wrong (inside a burst AXI-S02 flagged)

- test: aou_reset_test
  bug: BUGS/021
  check: 'AXI-S04: remote->local'
  requires: BUGS/021
  seed_dependent: true
  note: a remote read of bytes a cut M-port burst left wrong (inside a burst AXI-S02 flagged)

- test: aou_link_event_test
  bug: BUGS/007
  check: 'T1-L29: RX W beat pending'
  seed_dependent: true
  note: >-
    a stale remote W beat left in the RX FIFO (on I_RESETN, not the software reset) is still
    pending after AOU_SW_RESET and holds AOU_RX_FIFO_PENDING high (VCS 1x512-sp64
    +event=linkerror seed 2 with the BUGS/029 fix: WLAST_GEN WVALID[0] stuck from 411576.5 ns,
    software reset released at 411641.5 ns)

- test: aou_link_event_test
  bug: BUGS/007
  check: 'T1-V02: remote (L3) not ENABLED'
  requires: BUGS/007
  seed_dependent: true
  note: >-
    the stale beat T1-L29 reports blocks the DUT's ActivateReq, so it stays in ACTIVATE
    (same run: T1-V02/V03 at 431904.5 ns)

- test: aou_link_event_test
  bug: BUGS/007
  check: 'T1-V03: DUT not ENABLED'
  requires: BUGS/007
  seed_dependent: true
  note: the same blocked re-activation, seen from the DUT's status

- test: aou_link_event_test
  bug: BUGS/007
  check: 'T1-V06: not drained'
  requires: BUGS/007
  seed_dependent: true
  note: traffic queued for the link never leaves after the blocked re-activation

- test: aou_link_event_test
