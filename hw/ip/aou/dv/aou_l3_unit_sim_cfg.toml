schema_version = 1

# The L3 unit bench: the L3 protocol model and AOU_FDI_CHECKER in loopback in
# tb/aou_l3_unit_top.sv, no DUT (uvm/tests/l3_unit). The Bender target is the T1
# bench's so the runner's filelist stage has a graph to walk; the top does not
# instantiate the RTL. Standalone: make build TB=l3_unit. See aou_sim_cfg.toml
# for how the paths are read.
name = "aou_l3_unit"
profile = "native"
default_framework = "uvm"
description = "AXI-over-UCIe bridge L3 protocol-model unit bench (no DUT, SV-UVM)"

# The runner requires every implemented framework declared as a [frameworks.<name>]
# table; the build, sim and targets of this one-framework bench stay in the shared
# tables above and below, which the runner merges under it.
[frameworks.uvm]
description = "AoU L3 model unit bench, SV-UVM (the only framework)"

[testlist]
path = "testlists/l3_unit.toml"
format = "toml_list"

[defaults]
# The native profile defaults run_mode to smoke; this bench has one run mode.
run_mode = "l3_unit"
target = "default"
timeout_sec = 1800

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/ip/aou/dv/build/uvm_l3_unit"]

[build]
top_module = "aou_l3_unit_top"
top_file = "hw/ip/aou/dv/tb/aou_l3_unit_top.sv"
filelist = "hw/ip/aou/dv/build/uvm_l3_unit/aou_l3_unit_uvm_compile.f"
bender_filelist = "hw/ip/aou/dv/build/uvm_l3_unit/aou_l3_unit_uvm_bender.f"
work_dir = "hw/ip/aou/dv/build/uvm_l3_unit"
bender_targets = ["aou", "simulation"]
incdirs = [
  "hw/ip/aou/dv/uvm/env/checkers",
  "hw/ip/aou/dv/cov/sv",
  "hw/ip/aou/dv/uvm/env/pkg",
  "hw/ip/aou/dv/uvm/env/l3",
  "hw/ip/aou/dv/uvm/tests/l3_unit",
]
sources = [
  "hw/ip/aou/dv/uvm/env/checkers/aou_rule_pkg.sv",
  "hw/ip/aou/dv/cov/sv/aou_fc_pkg.sv",
  "hw/ip/aou/dv/uvm/env/checker/aou_fdi_wire_pkg.sv",
  "hw/ip/aou/dv/uvm/env/checker/aou_fdi_checker_pkg.sv",
  "hw/ip/aou/dv/uvm/env/checker/AOU_FDI_CHECKER.sv",
  "hw/ip/aou/dv/uvm/env/checker/aou_fdi_checker_if.sv",
  "hw/ip/aou/dv/uvm/env/checker/aou_fdi_chk_dir_tap.sv",
  "hw/ip/aou/dv/uvm/env/l3/aou_l3_pkg.sv",
  "hw/ip/aou/dv/uvm/env/pkg/core/aou_pkg.sv",
  "hw/ip/aou/dv/tb/aou_l3_unit_if.sv",
  "hw/ip/aou/dv/uvm/tests/l3_unit/aou_l3_unit_pkg.sv",
]


[build.vcs]
# The simulator-shipped UVM closest to the pinned uvm-core 2020.3.1 the standalone
# flow compiles (docs/DECISIONS.md D2). It reproduces the standalone runs seed for
# seed, so a harness regression compares with a standalone one; the default
# uvm-1.2 draws a different random stream from the same seed and does not.
uvm_lib = "uvm-ieee-2020-2.0"

[build.options]
# Partition the build directory by input fingerprint (as the SEP bench does):
# the targets share one work_dir and differ in defines, so without it a target
# switch would overwrite the other target's simv and a multi-target regression
# could run one target's model for another. Each unchanged target reuses its
# build; a source or define change rebuilds only that fingerprint.
cache_enabled = true

[run_modes.l3_unit]
description = "L3 model unit tests: codec, credits, cross-flit, destination RP, injection, link, loopback"
timeout_sec = 1800
args = []

[target_defaults.default]
defines = ["AOU_AXI_DATA_BYTES=64", "AOU_FDI_DATA_W=512", "AOU_RP_COUNT=4"]

# Each target builds in its own directory (build_dir/work_dir): the targets differ
# only in defines, so a shared work directory would hold one target's simv at a
# time. Standalone builds use the Makefile's build/<sim>-<tb>-<target> instead.
[targets.default]
description = "The only configuration: four RPs' worth of L3 state, no DUT"
build_dir = "hw/ip/aou/dv/build/uvm_l3_unit/default"
work_dir = "hw/ip/aou/dv/build/uvm_l3_unit/default"
defines = []
