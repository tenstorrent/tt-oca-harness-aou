# Register corrections.
- id: '20.16'
  title: Access an unmapped APB address; PSLVERR stays 0, unmapped offsets read 0 and addresses above the window alias the registers
  note: PSLVERR is tied 0, so the old PSLVERR expectation was wrong; aliasing and read-0 are tested instead.
- id: '20.2'
  title: Read/write control register 0 (AXI_SPLIT_TR_EN has no storage and reads 0, BUGS/004)
  note: AXI_SPLIT_TR_EN cannot be written; register tests that hit it are XFAIL against BUGS/004.

# Items changed by fixes merged on main.
- id: '13.12'
  title: axi_qos_to_hp boundary; a QoS value equal to the threshold is high priority (>=, reset 0xA)
  note: >-
    Main #77: the classifier compares with >= and the reset thresholds were
    swapped (HP 0xA, NP 0x5), so at reset 10-15 is high, 5-9 normal, 0-4 low.
- id: '13.13'
  title: axi_qos_to_np boundary; a QoS value equal to the threshold is normal priority (>=, reset 0x5)
  note: 'Main #77, as for 13.12.'
- id: '15.6'
  title: Configure 16-beat max write (MAX_AWBURSTLEN=15); split 32-beat burst
  note: 'Main #75 - only 2^n-1 MAX_AxBURSTLEN values are legal; any other write stores 0xF.'
- id: '15.7'
  title: Configure 16-beat max read (MAX_ARBURSTLEN=15); split 32-beat burst
  note: 'Main #75, as for 15.6.'
- id: '15.8'
  title: Configure 8-beat max write (MAX_AWBURSTLEN=7); split 16-beat burst
  note: 'Main #75, as for 15.6.'
- id: '15.9'
  title: Configure 8-beat max read (MAX_ARBURSTLEN=7); split 16-beat burst
  note: 'Main #75, as for 15.6.'
- id: '20.9'
  title: Read/write per-RP split config; legal 2^n-1 MAX_AxBURSTLEN values read back as written, any other value as 0xF
  note: 'Main #75 - the SFR stores an illegal MAX_AxBURSTLEN as 0xF (16 beats, the reset value).'
- id: '9.11'
  title: BRESP with BID not matching pending (subordinate side), on every RP; per-RP status and the BID mismatch interrupt
  note: >-
    Main #76: RP1-RP3 BID/RID mismatch interrupts were crossed; each aggregate
    now ORs the per-RP bits of its own type, so check every RP. 19.3 merged here.
- id: '9.12'
  title: RRESP with RID not matching pending (subordinate side), on every RP; per-RP status and the RID mismatch interrupt
  note: 'Main #76, as for 9.11.'
- id: '19.3'
  merged_into: '9.11'
  note: 'The SI0 ID-mismatch interrupt is checked by 9.11/9.12 (main #76 changed which pin each RP drives).'
- id: '1.9'
  title: Send ActivateReq while ENABLED; INVALID_ACTMSG and INT_REQ_LINKRESET, the ActivateAck is still sent
  note: 'Main #79 (MAS) - ActivateReq after the handshake has completed is a link error; the ack is still sent.'

