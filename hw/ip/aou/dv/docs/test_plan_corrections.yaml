# Corrections to the old test plan, applied by scripts/gen_plan_items.py when it
# writes docs/test_plan_items.yaml. One entry per item: `title` rewords it,
# `merged_into` makes it a duplicate that reports through the surviving ID,
# `dropped` removes it (not testable on this RTL). Every entry has a `note`.

# Granule counts: AoU v0.8 Table 6 gives WriteData1024 30 granules.
- id: '4.8'
  title: Single 128-byte write with DLENGTH_1024 (WriteData1024, 30 granules)
  note: The old plan said 28 granules; AoU v0.8 Table 6 says 30. 11.8 merged here.
- id: '6.6'
  title: WriteData1024 (30 granules) spanning flit boundary
  note: The old plan said 28 granules; AoU v0.8 Table 6 says 30.
- id: '11.8'
  merged_into: '4.8'
  note: Same message as 4.8 (WriteData1024, the largest message), which is 30 granules, not 28.

# WRAP/FIXED: AoU request messages have no burst field, and the DUT supports
# INCR bursts only (coverage-closure decision D1, DECISIONS D5).
- id: '4.16'
  dropped: The DUT supports INCR bursts only; AoU carries no AxBURST, so WRAP is out of scope (AXI-R19 flags it as a stimulus error).
  note: Owner decision D1 of the coverage-closure plan. Was "WRAP carried as INCR"; 5.16 goes with it.
- id: '4.17'
  dropped: The DUT supports INCR bursts only; AoU carries no AxBURST, so FIXED is out of scope (AXI-R19 flags it as a stimulus error).
  note: Owner decision D1 of the coverage-closure plan. Was "FIXED carried as INCR"; 5.17 goes with it.
- id: '5.16'
  dropped: Read side of 4.16; the DUT supports INCR bursts only.
  note: Was merged into 4.16, which is dropped (decision D1).
- id: '5.17'
  dropped: Read side of 4.17; the DUT supports INCR bursts only.
  note: Was merged into 4.17, which is dropped (decision D1).

