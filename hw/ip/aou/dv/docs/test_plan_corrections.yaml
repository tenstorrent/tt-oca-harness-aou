# Performance targets: bandwidth items get a pass criterion against the
# d2d-compare model (docs/perf_scenarios.yaml, uvm/env/perf/aou_perf_targets.svh).
- id: '10.1'
  title: >-
    Sustained back-to-back writes at full rate (S1): each link delivers at least 97% of the
    d2d_model bytes/cycle for the CONFIG, active PHY and traffic, never above it, with the
    model's message mix
  note: Was "Sustained back-to-back writes at full rate"; the criterion is the perf-targets gate (T1-P02..P04).
- id: '10.2'
  title: >-
    Sustained back-to-back reads at full rate (S1): each link delivers at least 97% of the
    d2d_model bytes/cycle for the CONFIG, active PHY and traffic, never above it, with the
    model's message mix
  note: Was "Sustained back-to-back reads at full rate"; the criterion is the perf-targets gate (T1-P02..P04).
- id: '10.3'
  title: >-
    Simultaneous max-rate reads and writes (S1, 50/50): each link delivers at least 97% of
    the d2d_model bytes/cycle, never above it, with the model's message mix
  note: Was "Simultaneous max-rate reads and writes"; the criterion is the perf-targets gate (T1-P02..P04).
- id: '10.8'
  title: >-
    Maximum flit rate: in every S1 window each link's delivered bytes/cycle is within 3% of
    the d2d_model saturated value (the FDI duty is reported, not gated)
  note: >-
    Was "Maximum flit generation rate (flits/cycle)". Flits per cycle alone does not say the
    flits are full; delivered bytes against the packing model does.
- id: '10.10'
  add: 'yes'
  priority: P2
  title: >-
    Small transfers (S2): 1-beat reads and writes, one side and both, at least 97% of the
    d2d_model bytes/cycle per link
  note: New with the perf-targets plan (scenario S2).
- id: '10.11'
  add: 'yes'
  priority: P2
  title: >-
    Partial-strobe writes (S3, WriteData) at least 97% of the d2d_model bytes/cycle per link;
    the full-strobe reference is 10.1
  note: New with the perf-targets plan (scenario S3).
- id: '10.12'
  add: 'yes'
  priority: P2
  title: >-
    Burst-length sweep (S4) 1 to 256 beats through the DUT splitter, AxSIZE narrowed to stay
    within 4 KB: at least 97% of the d2d_model bytes/cycle per link, the split visible in the
    message mix
  note: New with the perf-targets plan (scenario S4).
- id: '10.13'
  add: 'yes'
  priority: P2
  title: >-
    All RPs at once (S5) with 0, 50 and 100% of the transactions on the widest RP: at least
    97% of the d2d_model bytes/cycle per link
  note: New with the perf-targets plan (scenario S5).

