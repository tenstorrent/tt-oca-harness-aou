#
# The feature areas of the verification plan (docs/AOU_VPLAN.adoc, Feature
# Areas), in reading order. Each plan item of docs/test_plan_items.yaml belongs
# to exactly one area: every item of the old-plan sections listed in
# `sections` (item N.M is in section N), plus the single items in `items`,
# which take precedence. Item IDs never change; the area only decides where an
# item is shown and counted. scripts/plan_areas.py reads this file;
# scripts/gen_dv_docs.py groups the matrix by it and checks that every item
# lands in one area.

