  window: sm_wr
  traffic_dir: both
  wr_pct: 100
  beats: 1
  configs: [1x512-sp64, 1x256-sp32, 4xmix4211-sp128]
  plan_ids: [10.10]

- scenario: S2
  window: sm_rd
  traffic_dir: both
  wr_pct: 0
  beats: 1
  configs: [1x512-sp64, 1x256-sp32, 4xmix4211-sp128]
  plan_ids: [10.10]

- scenario: S2
  window: sm_wr_l2r
  traffic_dir: l2r
  wr_pct: 100
  beats: 1
  configs: [1x512-sp64, 1x256-sp32, 4xmix4211-sp128]
