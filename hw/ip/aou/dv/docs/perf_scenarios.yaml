#
# Performance scenarios: one entry per measurement window. scripts/perf_model.py
# builds the d2d_model traffic for each (make perf_targets), and the perf
# virtual sequence drives the same windows. Every window runs with no AXI or
# remote delay, the FDI always ready and full-rate issue on every side that
# takes part. All values are strings (scripts/listyaml.py).
#
#   scenario     S1..S6 (see the perf targets plan)
#   window       window name, the perf.txt / perf.json prefix
#   traffic_dir  l2r (local managers only), r2l (remote die only) or both
#   wr_pct       write share of the transactions, 0..100
#   beats        burst length in beats of each issuing side's own data width
#                (local: the RP's width; remote: the remote die's width)
#   bytes        instead of beats: fixed transfer size in bytes
#   offset       start address modulo the bus width (default 0, aligned)
#   strb         full (WriteDataFull expected) or partial (every beat strobed)
#   rps          all, or a comma list of RP indices
#   widest_pct   share of transactions on the widest RP (lowest index if tied);
#                the rest split evenly over the other RPs
#   remote_bytes remote die's AXI data bytes, one value or one per RP
#                (default 64, the bench's +remote_bytes default)
#   configs      all, or the CONFIGs the window runs on
#   optional     yes: generated only with perf_targets OPTIONAL=1
#   plan_ids     test-plan items the window gives criteria to
#
# A burst never crosses 4 KB: where `beats` beats of the bus width would
# exceed 4 KB, the issuing side narrows AxSIZE until the burst fits (S4's 128-
# and 256-beat windows run at 32 B and 16 B AxSIZE on a 64 B bus, and the
# same on a 128 B bus). That keeps the sweep in beats, which is what the DUT's
# splitter and the AoU messages count; a 16 B beat travels in a 256-bit Data
# message with strobes. A `bytes` window that would cross 4 KB on some
# issuing side is not generated for that config.
#
# Every burst crosses the link whole, in the DUT's runs and in the model: the
# DUT's transaction splitter (AXI_SPLIT_TR_RPn) divides the requests it receives,
# at its manager port, not what its subordinate port sends.
#
# The perf sequence (+perf_scn=<scenario>) issues, per RP and issuing side, a
# whole number of periods of the window's pattern (perf_model.py rp_weights),
# writes and reads alternating evenly, so the message mix on each link is the
# model's exactly. Windows are sized so every link with data carries at least
# +perf_kb (default 768 KB).

# S1 stream: 16-beat aligned bursts, full strobes. bw_wr/bw_rd/bw_mix are the
# windows aou_perf_vseq measures today.
- scenario: S1
  window: bw_wr
  traffic_dir: both
  wr_pct: 100
  beats: 16
  configs: all
  plan_ids: [10.1, 10.8]

- scenario: S1
  window: bw_rd
  traffic_dir: both
  wr_pct: 0
  beats: 16
  configs: all
  plan_ids: [10.2, 10.8]

- scenario: S1
  window: bw_mix
  traffic_dir: both
  wr_pct: 50
  beats: 16
  configs: all
  plan_ids: [10.3, 10.8]

- scenario: S1
  window: bw_wr_l2r
  traffic_dir: l2r
  wr_pct: 100
  beats: 16
  configs: all
  plan_ids: [10.1, 10.8]

- scenario: S1
  window: bw_wr_r2l
  traffic_dir: r2l
  wr_pct: 100
  beats: 16
  configs: all
  plan_ids: [10.1, 10.8]

- scenario: S1
  window: bw_rd_l2r
  traffic_dir: l2r
  wr_pct: 0
  beats: 16
  configs: all
  plan_ids: [10.2, 10.8]

- scenario: S1
  window: bw_rd_r2l
  traffic_dir: r2l
  wr_pct: 0
  beats: 16
  configs: all
  plan_ids: [10.2, 10.8]

- scenario: S1
  window: bw_mix_l2r
  traffic_dir: l2r
  wr_pct: 50
  beats: 16
  configs: all
  plan_ids: [10.3, 10.8]

- scenario: S1
  window: bw_mix_r2l
  traffic_dir: r2l
  wr_pct: 50
  beats: 16
  configs: all
  plan_ids: [10.3, 10.8]

# S2 small: 1-beat transfers.
