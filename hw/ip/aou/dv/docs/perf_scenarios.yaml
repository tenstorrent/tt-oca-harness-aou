- scenario: S3
  window: st_part
  traffic_dir: both
  wr_pct: 100
  beats: 16
  strb: partial
  configs: [1x512-sp64, 4xmix4211-sp128]
  plan_ids: [10.11]

- scenario: S3
  window: st_part_l2r
  traffic_dir: l2r
  wr_pct: 100
  beats: 16
  strb: partial
  configs: [1x512-sp64, 4xmix4211-sp128]
  plan_ids: [10.11]

- scenario: S3
