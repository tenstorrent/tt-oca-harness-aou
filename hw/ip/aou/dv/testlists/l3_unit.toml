schema_version = 1

# The L3 protocol model and AOU_FDI_CHECKER unit bench (TB=l3_unit, no DUT).
# The bench's aggregate (aou_l3_unit_sim_cfg.toml [testlist]).
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_l3_codec_test"
module = { uvm = "aou_l3_codec_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]

