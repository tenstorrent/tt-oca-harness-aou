schema_version = 1

# Data path (stream F).
#
# Data-path tests (plus issues #56 and #64). TB=t1. Each entry: test, seeds,
# plusargs and plan_ids; every entry runs on every configuration.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

