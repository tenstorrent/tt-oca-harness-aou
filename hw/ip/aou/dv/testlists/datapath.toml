# 9.20: the local subordinate answers 600 cycles late while the remote die keeps up
# to 128 requests in flight: the M-port pending-ID tables fill to M_RD_MO_CNT and
# M_WR_MO_CNT (32) and back-pressure, with no error and no lost transfer (FEAT-R22).
[[tests]]
name = "aou_dp_outstanding_test.dp_mfull-600.dp_wr_pct-0.1x512-sp64"
module = { uvm = "aou_dp_outstanding_test" }
target = "1x512-sp64"
seed = 1
reseed = 2
tags = ["datapath"]
run_modes = ["datapath"]
args = ["+dp_mfull=600", "+dp_wr_pct=0"]

