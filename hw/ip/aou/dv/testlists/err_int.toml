schema_version = 1

# Error and interrupt registers (stream G).
#
# AXI error responses, the response error debug FIFO, ID mismatch, credit
# violations and interrupts (plan 2.9, 2.19; TB=t1). Format as in link.yaml.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_axi_err_resp_test"
module = { uvm = "aou_axi_err_resp_test" }
seed = 1
reseed = 3
tags = ["err_int"]
run_modes = ["err_int"]

[[tests]]
name = "aou_axi_err_resp_test.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]

# Splitter error merge: 16-beat remote bursts split into sub-bursts, one (or
# two) of which hit a 32-byte error region; merged BRESP and per-beat RRESP.
[[tests]]
name = "aou_axi_err_resp_test.part-split.max_awburstlen-3.max_arburstlen-3"
module = { uvm = "aou_axi_err_resp_test" }
seed = 1
reseed = 3
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=split", "+max_awburstlen=3", "+max_arburstlen=3"]

[[tests]]
name = "aou_axi_err_resp_test.part-split.max_awburstlen-0.max_arburstlen-1"
module = { uvm = "aou_axi_err_resp_test" }
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=split", "+max_awburstlen=0", "+max_arburstlen=1"]

# Debug-window bursts: reads and pops longer than one beat (software issues
# single beats; the window answers any length) and longer than the splitter's
# MAX_AxBURSTLEN (default 15, or 0 below), which must not cut them; every read
# beat checked lane by lane against the FIFO head (T1-E19).
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.dbg_len-31"
module = { uvm = "aou_axi_err_resp_test" }
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+dbg_len=31"]

[[tests]]
name = "aou_axi_err_resp_test.part-fifo.dbg_len-max"
module = { uvm = "aou_axi_err_resp_test" }
seed = 1
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+dbg_len=max"]

[[tests]]
name = "aou_axi_err_resp_test.part-fifo.dbg_len-3.max_awburstlen-0.max_arburstlen-0"
module = { uvm = "aou_axi_err_resp_test" }
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+dbg_len=3", "+max_awburstlen=0", "+max_arburstlen=0"]

# Debug-window bursts the write aggregator would merge: modifiable 64-beat
# accesses from a 32-byte remote die into 64-byte RPs with the aggregator on.
# The window must answer them whole (MAS 3.8.2 condition 4).
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.dbg_len-63.dbg_cache-2.agg_en-1.remote_bytes-32.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+dbg_len=63", "+dbg_cache=2", "+agg_en=1", "+remote_bytes=32"]

# Failing reads the read aggregator merged: two 32-byte remote beats become one
# 64-byte M-port beat whose error pushes one entry per remote beat (MAS 3.8.3,
# 7.2.4); the pops drain them. The debug accesses stay single-beat.
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.err_len-1.agg_en-1.remote_bytes-32.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+err_len=1", "+agg_en=1", "+remote_bytes=32"]

# The same, with the failing transactions at a 32-byte offset: the first
# aggregated M-port beat is based below the read's start and holds one of its
# two beats, the second holds the other.
# Debug-window takes two at a time: two 16-beat reads of the head one cycle
# apart, so the second request is accepted while the first burst is still being
# returned, then two pops one cycle apart. Then four-beat accesses with six OKAY
# writes just ahead of each pair and one WriteResp credit: the writes' responses
# back up, so the first pop's response waits at the window while the second
# pop's address and data arrive. aou_t1_dbg_fifo_chk checks every read and pop.
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.take_pair-1.dbg_len-15"
module = { uvm = "aou_axi_err_resp_test" }
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+take_pair=1", "+dbg_len=15"]

[[tests]]
name = "aou_axi_err_resp_test.part-fifo.take_pair-1.take_wflood-6.dbg_len-3.wresp_crd-1.crd_delay-48.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+take_pair=1", "+take_wflood=6", "+dbg_len=3", "+wresp_crd=1", "+crd_delay=48"]

[[tests]]
name = "aou_axi_err_resp_test.part-fifo.err_len-1.err_off-32.agg_en-1.remote_bytes-32.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+err_len=1", "+err_off=32", "+agg_en=1", "+remote_bytes=32"]

# Four-beat failing reads at a 32-byte offset, split into two-beat sub-bursts
# (MAX_ARBURSTLEN 1; the writes stay whole) and each sub-burst aggregated on
# its own: the M-port beat at the sub-burst boundary holds one beat of each
# sub-burst, and the entries of each are the sub-burst's beats only (four
# entries for the read, not six).
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.err_len-3.err_off-32.agg_en-1.remote_bytes-32.max_awburstlen-3.max_arburstlen-1.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+err_len=3", "+err_off=32", "+agg_en=1", "+remote_bytes=32", "+max_awburstlen=3", "+max_arburstlen=1"]

# Aggregated two-beat failing reads whose data is accepted at the M port but
# backs up on its way to the remote die (few, late ReadData credits and a
# four-beat OKAY read just ahead of each B/R pair), with the pair's B error
# issued 64 cycles later: the B enters the FIFO before the read's re-expanded
# beats although the M port saw the read's beat first.
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.err_len-1.agg_en-1.remote_bytes-32.rdata_crd-8.crd_delay-64.flood-1.flood_len-3.pair_gap-64.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+err_len=1", "+agg_en=1", "+remote_bytes=32", "+rdata_crd=8", "+crd_delay=64", "+flood=1", "+flood_len=3", "+pair_gap=64"]

# The same with three B errors per pair: the hardware keeps the three B
# entries and the first re-expanded beat and drops the second, while by
# M-port time the read's beats are the oldest; the model must not judge the
# head until the pops have drained the FIFO.
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.err_len-1.agg_en-1.remote_bytes-32.rdata_crd-8.crd_delay-64.flood-1.flood_len-3.pair_gap-64.pair_writes-3.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+err_len=1", "+agg_en=1", "+remote_bytes=32", "+rdata_crd=8", "+crd_delay=64", "+flood=1", "+flood_len=3", "+pair_gap=64", "+pair_writes=3"]

# Eight-beat 32-byte failing reads on RPs four times the remote die's width
# (RP2, RP3): the seventh read, into an empty FIFO, is two full M-port error
# beats accepted back to back, each re-expanded into four entries; the FIFO
# keeps the first four narrow beats, which the model must time in order
# across the M-port beats. The pair's B error waits 64 cycles so it does not
# cloud the drop that follows.
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.err_len-7.agg_en-1.remote_bytes-32.pair_gap-64.4xmix2144-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4xmix2144-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+err_len=7", "+agg_en=1", "+remote_bytes=32", "+pair_gap=64"]

# Each debug pop issued four cycles after the debug read without waiting for
# its data, a 16-beat OKAY read just ahead: the window samples the head when
# the read becomes active and the pop then removes it, while the read's data
# queues behind the flood's and completes after the pop's B; the read returns
# the entry the pop removed.
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.take_overlap-4.take_flood-15.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+take_overlap=4", "+take_flood=15"]

# As above, and once each pop has completed a second debug read with another
# ID, issued while the first still waits behind the flood. It was issued after
# the pop, so it must return the entry behind the popped one, never the popped
# one, and it settles which of two errors pushed together is left.
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.take_overlap-4.take_flood-15.read_after_pop-1.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+take_overlap=4", "+take_flood=15", "+read_after_pop=1"]

# Each debug pop issued first and the debug read 16 cycles later, behind an
# OKAY write whose B holds the RP's only WriteResp credit: the pop takes the
# head before the read becomes active, and the read's data completes before
# the pop's B, returning the entry behind the popped one. A second read with
# nothing in flight must return the same entry.
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.pop_lead-16.wresp_crd-1.crd_delay-256.4x512-sp64"
module = { uvm = "aou_axi_err_resp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+pop_lead=16", "+wresp_crd=1", "+crd_delay=256"]

# Failing 64-byte writes at a 32-byte offset into a 256-bit RP: the width
# converter aligns the address down to AWSIZE and the B entry carries that
# address (MAS 7.2.4).
[[tests]]
name = "aou_axi_err_resp_test.part-fifo.err_off-32.1x256-sp32"
module = { uvm = "aou_axi_err_resp_test" }
target = "1x256-sp32"
seed = 1
reseed = 2
tags = ["err_int"]
run_modes = ["err_int"]
args = ["+part=fifo", "+err_off=32"]

