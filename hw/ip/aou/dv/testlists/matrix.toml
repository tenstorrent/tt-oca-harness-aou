schema_version = 1

# Configuration matrix (stream J).
#
# Configuration matrix (stream J): multi-RP (plan 2.12), data width conversion
# (2.14) and performance data (2.10) on the CONFIGs of docs/ARCHITECTURE.md. TB=t1.
# The latency and drain performance runs pass when they produced their data;
# scripts/perf_report.py tabulates perf.txt. The gated bandwidth scenarios
# (plan 10.1-10.3, 10.8, 10.10-10.13) are in perf.yaml.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_mrp_test.mrp_scn-solo.mrp_rps-0"
module = { uvm = "aou_mrp_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["matrix"]
run_modes = ["matrix"]
args = ["+mrp_scn=solo", "+mrp_rps=0"]

