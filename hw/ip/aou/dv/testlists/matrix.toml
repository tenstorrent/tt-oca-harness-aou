# TX_NXT_PACKING_EN 1 (target -nxt): the TX packer's registered output stage,
# the other value of the AOU_TX_CORE parameter (default 0 everywhere else).
# The link gate, mixed-direction traffic, the flit packing scenarios and
# back-pressure on every channel, since the stage sits between the granule
# ring and the FDI output.
