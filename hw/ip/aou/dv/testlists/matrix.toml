# The per-RP remote widths put every RP of the 4xmix pair through each of its
# converters. aou_dw_down1024_test sends 1024-bit remote traffic to the 256-bit
# RPs, unaligned. The remote model's WriteReq keeps AWSIZE by default and its
# WriteData matches it, so an AWSIZE=6 write takes the 512-bit downsizer, not
# the 1024-bit one (that takes full-width WriteData under a size-6 WriteReq:
# +remote_wreq=dut_like below).
