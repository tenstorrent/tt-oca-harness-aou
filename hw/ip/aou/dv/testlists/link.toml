schema_version = 1

# Credits and link (stream G).
#
# Credits/link tests (TB=t1). One entry per run-list line: the test, its
# plusargs, how many seeds and the test-plan IDs it covers
# (docs/test_plan_items.yaml).
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_link_act_deact_test"
module = { uvm = "aou_link_act_deact_test" }
seed = 1
reseed = 4
tags = ["link"]
run_modes = ["link"]

