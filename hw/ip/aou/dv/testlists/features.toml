schema_version = 1

# Features (stream F).
#
# Feature tests: aggregator, early BRESP, splitting, QoS modes, DEST_RP, TX LP
# mode and the rest. TB=t1. Width bypass (14.8) runs as an aou_dp_size_test entry.
# Entries run on every configuration unless a pin says why not.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_split_test.split_aw-15.split_ar-15.dp_len-0_1_3_7_15"
module = { uvm = "aou_split_test" }
seed = 1
reseed = 2
tags = ["features"]
run_modes = ["features"]
args = ["+split_aw=15", "+split_ar=15", "+dp_len=0,1,3,7,15"]

