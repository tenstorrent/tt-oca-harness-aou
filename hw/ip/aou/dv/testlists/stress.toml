schema_version = 1

# Stress (stream F).
#
# Stress, corners, packing and data integrity (stream K, milestone M6): flit packing
# under non-DUT-like L3 policies, data patterns and address corners, back-pressure
# extremes on every AXI channel and the FDI, and QoS arbitration order with a TX
# backlog (FEAT-R11..R14). TB=t1. An entry without config runs on every CONFIG.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_pack_test.pk-crossflit.remote_bytes-32"
module = { uvm = "aou_pack_test" }
seed = 1
reseed = 2
tags = ["stress"]
run_modes = ["stress"]
args = ["+pk=crossflit", "+remote_bytes=32"]

