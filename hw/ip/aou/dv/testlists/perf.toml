schema_version = 1

# Performance data.
#
# Performance gate (plan items 10.x): every scenario of docs/perf_scenarios.yaml on
# the CONFIGs it names, TB=t1. aou_perf_chk judges each window's links against
# uvm/env/perf/aou_perf_targets.svh (T1-P02 at least 97% of the d2d_model value,
# T1-P03 not above it, T1-P04 the model's message mix). The windows are
# deterministic (aou_perf_seq), so one seed is enough. Two-PHY builds run once
# per active PHY, since the target depends on it.
# The latency and drain windows (10.4-10.7, 10.9) are in matrix.toml.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_perf_test.perf_scn-S1.1x512-sp64"
module = { uvm = "aou_perf_test" }
target = "1x512-sp64"
seed = 1
tags = ["perf"]
run_modes = ["perf"]
args = ["+perf_scn=S1", "+aou_config=1x512-sp64"]

