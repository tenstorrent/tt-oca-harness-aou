# S1 outstanding-depth sweep: how much concurrency the link needs before it
# saturates. Each manager keeps +perf_slots transactions outstanding (the DUT's
# S_*_MO_CNT default is 32); below the knee the link is limited by the round trip,
# not by its packing. Report only (+perf_report_only): the windows are measured
# and written to perf.json, and T1-P02..P04 judge none of them, because the point
# of the sweep is the measured plateau, not a pass/fail bound. The gated S1 runs
# above stay the regression gate at the default depth.

[[tests]]
name = "aou_perf_test.perf_scn-S1.perf_slots-1.1x512-sp64"
module = { uvm = "aou_perf_test" }
target = "1x512-sp64"
seed = 1
tags = ["perf"]
