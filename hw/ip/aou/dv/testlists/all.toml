schema_version = 1

# The T1 bench's aggregate (aou_sim_cfg.toml [testlist]): the per-area lists, the
# sanity scenario and the groups that span areas. Every group name below and in the
# included lists is an --items target of run_list.py and of the harness runner.
includes = ["g1a.toml", "g1b.toml", "t1_api.toml", "fdi.toml", "datapath.toml", "features.toml", "stress.toml", "link.toml", "errors.toml", "err_int.toml", "lifecycle.toml", "matrix.toml", "perf.toml", "assertions.toml"]

# The bring-up gate's pair: aou_sanity_test runs aou_sanity_test_seq through
# ocah_test's run_single_scenario (link up, activate, traffic both ways, drain).
[[tests]]
name = "aou_sanity_test"
module = { uvm = "aou_sanity_test" }
seed = 1
tags = ["smoke"]
run_modes = ["smoke"]

# Bring-up gate: the sanity scenario and the G1a slice (make/CI smoke)
[[groups]]
name = "smoke"
expected_count = 4
tests = [
  "aou_sanity_test",
  "aou_t1_slice_test",
  "aou_t1_deact_test",
  "aou_fdi_t1_bringup_test",
]

# Pull-request gate (.github/workflows/uvm-smoke.yml): smoke, the short lists g1a,
# g1b and t1_api (bring-up, link events, low-power, injection, both resets) and the
# datapath area (real AXI traffic: sizes, bursts, strobes, unaligned, outstanding,
# packing, random traffic both ways, attributes, channel ordering), on the default
# target; the datapath scenarios pinned to 4x512-sp64 are left to the nightly.
# Sized for a GitHub-hosted runner on Verilator (the workflow runs every configured seed).
[[groups]]
name = "ci"
