# PCLK:CLK ratios through the asynchronous APB bridge (plan 11.17): slow
# (25 MHz), fast (1.67 GHz, PCLK faster than CLK) and near-equal (987 MHz, so
# the phase drifts through every alignment). CLK stays 1 GHz.
[[tests]]
name = "aou_reg_bit_bash_test.pclk_ps-40000"
module = { uvm = "aou_reg_bit_bash_test" }
seed = 1
reseed = 2
tags = ["registers"]
run_modes = ["registers"]
args = ["+pclk_ps=40000"]

