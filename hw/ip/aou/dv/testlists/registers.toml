schema_version = 1

# Register tests on the APB-only register bench (TB=reg).
# The register bench's aggregate (aou_reg_sim_cfg.toml [testlist]).
#
# Register tests on the APB-only bench. tb: reg; no config.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_reg_hw_reset_test"
module = { uvm = "aou_reg_hw_reset_test" }
seed = 1
reseed = 2
tags = ["registers"]
run_modes = ["registers"]

[[tests]]
name = "aou_reg_bit_bash_test"
module = { uvm = "aou_reg_bit_bash_test" }
seed = 1
reseed = 2
tags = ["registers"]
run_modes = ["registers"]

[[tests]]
