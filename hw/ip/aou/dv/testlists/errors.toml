schema_version = 1

# Error injection (stream G).
#
# Error-injection tests (TB=t1); format as in link.yaml.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_invalid_actmsg_test.state-all.op-all"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
reseed = 2
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=all", "+op=all"]

[[tests]]
name = "aou_invalid_actmsg_test.state-enabled"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
reseed = 2
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=enabled"]

[[tests]]
name = "aou_invalid_actmsg_test.state-activate"
