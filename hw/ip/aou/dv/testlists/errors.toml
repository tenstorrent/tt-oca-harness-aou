# Subordinate-side ID mismatch on every RP; 4x512-sp64 is where main #76 shows.
[[tests]]
name = "aou_slv_id_mismatch_test.4x512-sp64"
module = { uvm = "aou_slv_id_mismatch_test" }
target = "4x512-sp64"
seed = 1
reseed = 2
tags = ["errors"]
run_modes = ["errors"]

