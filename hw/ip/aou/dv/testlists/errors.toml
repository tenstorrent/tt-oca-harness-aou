module = { uvm = "aou_slv_id_mismatch_test" }
target = "1x512-sp64"
seed = 1
tags = ["errors"]
run_modes = ["errors"]

[[groups]]
name = "errors"
expected_count = 17
tests = [
  "aou_invalid_actmsg_test.state-all.op-all",
  "aou_invalid_actmsg_test.state-enabled",
  "aou_invalid_actmsg_test.state-activate",
  "aou_invalid_actmsg_test.state-deactivate",
  "aou_invalid_actmsg_test.state-disabled",
  "aou_invalid_actmsg_test.mask-1",
  "aou_invalid_actmsg_test.state-deactivate.op-act_req.react_linkerror-0",
  "aou_invalid_actmsg_test.state-deactivate.op-act_req.trdy-bursty.burst_max-8.reps-8",
  "aou_invalid_actmsg_test.state-enabled.op-act_req.trdy-random.trdy_pct-40.reps-8",
  "aou_invalid_actmsg_test.state-enabled.op-deact_ack.followup-remote",
