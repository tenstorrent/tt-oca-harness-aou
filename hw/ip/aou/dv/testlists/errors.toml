# The Adapter enters LinkError as soon as lp_linkerror rises (fdi_enc=SPEC and a
# DUT with lp_linkerror): the ActivateAck that follows is lost (BUGS/037).
[[tests]]
name = "aou_invalid_actmsg_test.state-deactivate.op-act_req.react_linkerror-1"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=deactivate", "+op=act_req", "+react_linkerror=1"]

# T1-L30 (the Ack to an invalid ActivateReq is on FDI before lp_linkerror) with
# pl_trdy holes and low runs, so the Ack's flit can still be inside the DUT's
# TX output stage when the DUT decides to raise lp_linkerror (BUGS/037).
[[tests]]
name = "aou_invalid_actmsg_test.state-deactivate.op-act_req.trdy-bursty.burst_max-8.reps-8"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
reseed = 4
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=deactivate", "+op=act_req", "+trdy=bursty", "+burst_max=8", "+reps=8"]

[[tests]]
name = "aou_invalid_actmsg_test.state-enabled.op-act_req.trdy-random.trdy_pct-40.reps-8"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
reseed = 4
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=enabled", "+op=act_req", "+trdy=random", "+trdy_pct=40", "+reps=8"]

