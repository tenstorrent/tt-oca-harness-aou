schema_version = 1

# Error injection (stream G).
#
# Error-injection tests (TB=t1); format as in link.yaml.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_invalid_actmsg_test.state-all.op-all"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
reseed = 2
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=all", "+op=all"]

[[tests]]
name = "aou_invalid_actmsg_test.state-enabled"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
reseed = 2
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=enabled"]

[[tests]]
name = "aou_invalid_actmsg_test.state-activate"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=activate"]

[[tests]]
name = "aou_invalid_actmsg_test.state-deactivate"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=deactivate"]

[[tests]]
name = "aou_invalid_actmsg_test.state-disabled"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=disabled"]

[[tests]]
name = "aou_invalid_actmsg_test.mask-1"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
tags = ["errors"]
run_modes = ["errors"]
args = ["+mask=1"]

# The Adapter answers lp_linkerror by itself by default; here the test
# recovers instead (an Adapter LinkError from the test). The invalid
# ActivateReq gets no ActivateAck either way (AoU v0.8 8.3.3/8.4).
[[tests]]
name = "aou_invalid_actmsg_test.state-deactivate.op-act_req.react_linkerror-0"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=deactivate", "+op=act_req", "+react_linkerror=0"]

# T1-L15 (no ActivateAck to an invalid ActivateReq) with pl_trdy holes and low
# runs, so the DUT's TX output stage is busy when the invalid ActivateReq
# arrives.
[[tests]]
name = "aou_invalid_actmsg_test.state-deactivate.op-act_req.trdy-bursty.burst_max-8.reps-8"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
reseed = 4
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=deactivate", "+op=act_req", "+trdy=bursty", "+burst_max=8", "+reps=8"]

[[tests]]
name = "aou_invalid_actmsg_test.state-enabled.op-act_req.trdy-random.trdy_pct-40.reps-8"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
reseed = 4
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=enabled", "+op=act_req", "+trdy=random", "+trdy_pct=40", "+reps=8"]

# A DeactivateAck in ENABLED, which no compliant peer sends and the spec does
# not define, then a deactivation the remote die starts (its DeactivateReq
# before its DeactivateAck). Either the stray is absorbed and the link keeps
# working, or it ends in a reported error and software's recovery, after which
# traffic must complete (T1-L16); a hang fails. env.status records which.
[[tests]]
name = "aou_invalid_actmsg_test.state-enabled.op-deact_ack.followup-remote"
module = { uvm = "aou_invalid_actmsg_test" }
seed = 1
reseed = 2
tags = ["errors"]
run_modes = ["errors"]
args = ["+state=enabled", "+op=deact_ack", "+followup=remote"]

