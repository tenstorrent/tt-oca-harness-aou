schema_version = 1

# Reset, low-power and link events (stream G).
#
# Reset, low-power and link-event tests (TB=t1); format as in link.yaml.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_link_event_test.event-retrain"
module = { uvm = "aou_link_event_test" }
seed = 1
reseed = 2
tags = ["lifecycle"]
run_modes = ["lifecycle"]
args = ["+event=retrain"]

