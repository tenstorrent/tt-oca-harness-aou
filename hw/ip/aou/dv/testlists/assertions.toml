schema_version = 1

# The RTL's ASSERTION_ON checks (plan 11.18) on the <CONFIG>-assert targets.
#
# Regression on a build with the RTL's own ASSERTION_ON checks (plan 11.18): FIFO
# ready/valid, M-port AW/AR stability in the 1xN switch, table ID errors in the
# early-response, aggregator, splitter and downsizer tables. The WLAST generator's
# AWREADY-within-500-cycles check is off (BUGS/054, tb/tb_top.sv). A firing
# assertion calls $finish before the UVM report, so check_run.py judges the run FAIL.
# +rtl_asserts=1 makes a run on a build without the assertions fatal, so these
# entries pass only on an assertion build:
#   make build RTL_ASSERT=1 CONFIG=<c>
#   python3 scripts/run_list.py --target <c>-assert --items assertions
# A representative set per configuration: data path, every table the assertions
# watch, AXI back-pressure, multi-RP switching and width conversion.
#
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_t1_slice_test.rtl_asserts-1.1x512-sp64-assert"
module = { uvm = "aou_t1_slice_test" }
target = "1x512-sp64-assert"
seed = 1
reseed = 2
tags = ["assertions"]
run_modes = ["assertions"]
args = ["+rtl_asserts=1"]

